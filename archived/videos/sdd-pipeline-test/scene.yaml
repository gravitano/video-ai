- id: 04_escalation
  vo: Makin cepat kamu nge-prompt, makin cepat juga kamu bikin hal yang salah.
  duration: 5
  vo_offset: 0.3
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 04, 15–20s: wide shot of the studio overwhelmed
    by many floating translucent red holographic panels and broken, tangled flow lines surrounding the desk; the developer
    has both hands on his head, overwhelmed. Same character face, black hoodie, studio, and rendering style. Camera: 35mm
    wide shot, slightly high angle, full desk and character visible. Mood: chaotic but readable, red glow dominant with navy
    shadows. Preserve vertical 9:16 and safe overlay space. No readable text, captions, logos, watermarks, new characters,
    or unrelated objects.
  motion_prompt: >-
    Animate the supplied Shot 04 keyframe for 5 seconds. Subject: the developer keeps his hands on his head and slowly shakes
    it. Camera: slow pull-out. Environment: red holographic panels multiply and drift around the desk, broken flow lines flicker.
    Timing: chaos builds steadily to the last frame. Preserve the exact character appearance, clothing, room layout, composition,
    and style. Controlled motion. No new text, subtitles, logos, scene transitions, or camera cuts.
  camera:
    from: 1.26
    to: 1.04
    origin: 50% 55%
    ease: power2.out
  hud:
    text: 04 — ESCALATION
    color: danger
  overlays:
  - type: headline
