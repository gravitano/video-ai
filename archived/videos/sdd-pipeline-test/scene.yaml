- id: 07_transform
  vo: >-
    Lalu AI mengimplementasikan spec itu, langkah demi langkah, dan tiap langkah bisa kamu cek.
  duration: 6
  vo_offset: 0.2
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 07, 33–40s: streams of cyan light flow from the
    four spec modules into the laptop, and both monitors assemble a clean abstract application interface block by block; the
    developer watches attentively with a slight nod. Same character face, black hoodie, studio, palette, and rendering style.
    Camera: 35mm three-quarter view from behind-left, showing the board, the laptop, and the monitors. Mood: progress and
    momentum, bright cyan with warm amber accents. Preserve vertical 9:16 and safe overlay space. No readable text, captions,
    logos, watermarks, new characters, or unrelated objects.
  motion_prompt: >-
    Animate the supplied Shot 07 keyframe for 7 seconds. Subject: the developer watches and gives a small approving nod. Camera:
    slow arc from behind-left toward the side. Environment: cyan light streams flow from the spec modules into the laptop;
    the abstract app interface on the monitors assembles block by block. Timing: steady build, interface completes near the
    end. Preserve the exact character appearance, clothing, room layout, composition, and style. Natural motion. No new text,
    subtitles, logos, scene transitions, or camera cuts.
  camera:
    from: 1.08
    to: 1.14
    origin: 40% 55%
