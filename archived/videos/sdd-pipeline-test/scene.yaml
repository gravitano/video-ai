# S.C.E.N.E. example — the 45s SDD Reels, expressed as a pipeline spec.
# Produced by: scene voice → scene keyframes → scene clips → scene build → scene render

project: sdd-reels-45s
brief:
  topic: Spec Driven Development
  audience: Developer dan vibe coder
  platform: reels
  duration: 45
  language: id
  message: Tulis spec sebelum AI coding
  cta: Coba workflow berbasis spec di proyek berikutnya
format:
  width: 1080
  height: 1920
  fps: 30
theme:
  bg: '#0A1428'
  ink: '#EAF4F8'
  accent: '#3FD8EA'
  warm: '#FFB35C'
  danger: '#FF5A68'
  fonts:
    display: Archivo Black
    mono: JetBrains Mono
    caption: Montserrat
style:
  reference_prompt: >-
    Original developer character reference. Southeast Asian man in his late 20s, short slightly messy black hair, clean-shaven,
    no glasses, plain black hoodie with no logo, seated at a dark wood desk in a nighttime futuristic developer studio: silver
    laptop, two vertical monitors with abstract cyan code light, mechanical keyboard, amber desk lamp on the right, blurred
    city window behind. Dark navy palette, cyan key light from the monitors, warm amber rim light. Cinematic photoreal, subtle
    film grain, 35mm lens, shallow depth of field. Vertical 9:16, medium shot, face clearly visible. Leave empty space at
    top and bottom for overlays. No readable text, captions, logos, or watermarks.
providers:
  image:
    name: codex
  voice:
    name: edge
    voice: id-ID-ArdiNeural
    rate: +12%
  video:
    name: mock
    model: MiniMax-H3
    resolution: 768P
    prompt_expansion: disabled
  music:
    name: synth
    turn_at_shot: 05_solution
budget:
  video_usd: 5
captions:
  zone: bottom
  max_words: 4
  keywords:
    spec: accent
    error: danger
    salah: danger
    development: accent
audio:
  music_volume: 0.55
  carve: true
shots:
- id: 01_hook
  vo: AI sekarang bisa nulis kode secepat kilat.
  duration: 4
  vo_offset: 0.4
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 01, 0–4s: side close-up of the developer typing
    fast on the mechanical keyboard, focused expression, streams of abstract cyan code light reflecting on his face. Same
    character face, black hoodie, studio, palette, and rendering style. Camera: 50mm close-up from the left side, hands and
    face in frame. Mood: energetic, cool cyan light with a small amber rim. Preserve vertical 9:16 and safe overlay space
    at top and bottom. No readable text, captions, logos, watermarks, new characters, or unrelated objects.
  motion_prompt: >-
    Animate the supplied Shot 01 keyframe for 4 seconds. Subject: the developer types rapidly with focused eyes. Camera: slow
    cinematic push-in. Environment: abstract cyan code light scrolls and flickers across his face, subtle ambient particles.
    Timing: fast typing from the first frame. Preserve the exact character appearance, clothing, room layout, composition,
    and style. Natural, controlled motion. No new text, subtitles, logos, scene transitions, or camera cuts.
  camera:
    from: 1.12
    to: 1.24
    origin: 45% 42%
    y:
    - 0
    - -12
  hud:
    text: 01 — HOOK
    color: accent
  overlays:
  - type: headline
    text: AI CODING
    top: 292
    size: 124
    color: ink
    at: 1.2
    anim: slam
  - type: headline
    text: = CEPAT
    top: 424
    size: 124
    color: accent
    at: 1.66
    anim: slam
  fx:
  - type: glow
    x: 78%
    y: 44%
    color: accent
  sfx:
  - at: 0.05
    name: typing
    vol: 0.45
  - at: 1.15
    name: whoosh-short
    vol: 0.5
  - at: 1.5
    name: typing
    vol: 0.4
  - at: 1.6
    name: impact-bass-2
    vol: 0.3
- id: 02_setup
  vo: Tinggal ketik prompt, ratusan baris kode langsung jadi. Tapi...
  duration: 5
  vo_offset: 0.3
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 02, 4–9s: over-the-shoulder view as both monitors
    fill with cascading abstract blocks of glowing cyan code; the developer leans back in his chair with a slight satisfied
    smile. Same character face, black hoodie, studio, palette, and rendering style. Camera: 35mm over-the-shoulder from behind-right.
    Mood: confident, bright cyan screens, warm amber lamp. Preserve vertical 9:16 and safe overlay space. No readable text,
    captions, logos, watermarks, new characters, or unrelated objects.
  motion_prompt: >-
    Animate the supplied Shot 02 keyframe for 5 seconds. Subject: the developer finishes typing, then leans back in his chair
    with a slight satisfied smile. Camera: slow dolly to the right. Environment: blocks of cyan code cascade quickly down
    both monitors. Timing: lean back at around 2 seconds, hold the smile at the end. Preserve the exact character appearance,
    clothing, room layout, composition, and style. Natural motion. No new text, subtitles, logos, scene transitions, or camera
    cuts.
  camera:
    from: 1.12
    to: 1.12
    origin: 50% 45%
    x:
    - 44
    - -44
  hud:
    text: 02 — SETUP
    color: accent
  overlays:
