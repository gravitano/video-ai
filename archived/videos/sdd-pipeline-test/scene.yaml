- id: 03_problem
  vo: AI nggak tahu apa yang sebenarnya kamu mau. Hasilnya? Error.
  duration: 6
  vo_offset: 0.4
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 03, 9–15s: frontal medium shot; both monitors
    have turned into a harsh red error glow, the developer's hands have frozen above the keyboard, brow furrowed in confusion,
    his face lit red. Same character face, black hoodie, studio, and rendering style; red light is an intentional change.
    Camera: 35mm eye-level frontal medium shot. Mood: tense, red screen light fighting the navy darkness, amber lamp still
    visible. Preserve vertical 9:16 and safe overlay space. No readable text, captions, logos, watermarks, new characters,
    or unrelated objects.
  motion_prompt: >-
    Animate the supplied Shot 03 keyframe for 6 seconds. Subject: the developer's hands stay frozen above the keyboard, his
    brow tightens, he leans slightly toward the screen. Camera: subtle handheld drift. Environment: red error light pulses
    and flickers on the monitors and his face. Timing: two slow red pulses, confusion growing. Preserve the exact character
    appearance, clothing, room layout, composition, and style. Natural motion. No new text, subtitles, logos, scene transitions,
    or camera cuts.
  camera:
    from: 1.1
    to: 1.18
    origin: 58% 38%
  hud:
    text: 03 — PROBLEM
    color: danger
  overlays:
  - type: headline
    text: AI NGGAK TAHU
    top: 292
    size: 104
    color: ink
    at: 0.9
    anim: rise
    out: 4.5
  - type: headline
    text: MAUMU
    top: 410
