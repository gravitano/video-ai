- id: 05_solution
  vo: 'Solusinya: sebelum coding, tulis spec dulu.'
  duration: 5
  vo_offset: 0.6
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 05, 20–25s: the developer looks up from the laptop
    as a clean cyan software specification board appears in the air in front of him: four empty connected modules, simple
    flow arrows, decision nodes and check marks. The chaotic red panels are gone. Calm reveal after the chaos. Same face,
    black hoodie, navy studio, amber lamp, and rendering style. Camera: 35mm medium shot from slightly behind the board, facing
    the developer. Mood: calm relief, cyan glow returns, warm amber accent. Preserve vertical 9:16 and safe overlay space.
    No labels, lettering, captions, logos, or watermarks.
  motion_prompt: >-
    Animate the supplied Shot 05 keyframe for 5 seconds. Subject: the developer slowly lifts his gaze from the laptop to the
    spec board. Camera: gentle push-in. Environment: the four cyan spec modules illuminate one by one, subtle screen reflections
    on his face. Timing: calm reveal, last module lights near the end. Preserve all visual identities, composition, and style.
    Natural motion. No text, labels, subtitles, logos, or transitions.
  camera:
    from: 1.04
    to: 1.14
    origin: 50% 50%
  hud:
    text: 05 — SOLUTION
    color: accent
  overlays:
  - type: headline
    text: 'SOLUSINYA:'
