- id: 06_spec
  vo: >-
    Spec itu berisi requirement, alur, aturan bisnis, dan kriteria terima. Jelas apa yang dibangun, dan kapan dianggap selesai.
  duration: 8
  vo_offset: 0.0
  keyframe_prompt: >-
    Use the approved reference as the identity and environment anchor. Shot 06, 25–33s: close-up of the holographic cyan specification
    board with four stacked modules arranged vertically with clear gaps between them; the developer's hand reaches in and
    touches the first module, which glows brighter while the other three stay dim. Same face (partially visible), black hoodie
    sleeve, navy studio, amber lamp bokeh, and rendering style. Camera: 50mm close-up, board centered, empty space beside
    each module for editor labels. Mood: focused and clear, clean cyan light. Preserve vertical 9:16. No labels, lettering,
    captions, logos, or watermarks.
  motion_prompt: >-
    Animate the supplied Shot 06 keyframe for 8 seconds. Subject: the developer's hand touches the four spec modules from
    top to bottom, one every two seconds; each module brightens when touched and stays lit. Camera: small, slow orbit to the
    right. Environment: soft cyan particles drift around the board, amber bokeh in the background. Timing: touches at about
    0.5s, 2.5s, 4.5s, and 6.5s. Preserve the exact hand, sleeve, board layout, composition, and style. Natural motion. No
    text, labels, subtitles, logos, or transitions.
  camera:
    from: 1.03
    to: 1.07
    origin: 62% 55%
