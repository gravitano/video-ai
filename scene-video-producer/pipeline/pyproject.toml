[project]
name = "scene-pipeline"
version = "0.1.0"
description = "S.C.E.N.E. short-form AI video pipeline: scene.yaml -> keyframes -> voice -> MiniMax clips -> HyperFrames -> MP4"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "edge-tts>=7.0",
  "numpy>=1.26",
]

[project.scripts]
scene = "scene.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scene"]
